name: Outfitting Manager CLI - Release

on:
  push:
    tags:
      - "cli-v*"

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            outfile: dist/outfitting-manager-linux-x64
            artifact_name: outfitting-manager-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            outfile: dist/outfitting-manager-linux-arm64
            artifact_name: outfitting-manager-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            outfile: dist/outfitting-manager-darwin-arm64
            artifact_name: outfitting-manager-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            outfile: dist/outfitting-manager-windows-x64.exe
            artifact_name: outfitting-manager-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Inject version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#cli-v}"
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${TAG}\"/" manager/cli/package.json
          rm -f manager/cli/package.json.bak

      - name: Build target
        run: bun build --compile --target=${{ matrix.target }} manager/cli/index.ts --outfile manager/cli/${{ matrix.outfile }}

      - name: Create archive and checksums
        shell: bash
        run: |
          cd manager/cli/dist
          BINARY="$(basename "${{ matrix.outfile }}")"
          ARCHIVE="${BINARY}.zip"
          chmod 755 "${BINARY}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -LiteralPath '${BINARY}' -DestinationPath '${ARCHIVE}' -Force"
          else
            zip -j "${ARCHIVE}" "${BINARY}"
          fi
          for FILE in "${BINARY}" "${ARCHIVE}"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${FILE}" > "${FILE}.sha256"
            else
              shasum -a 256 "${FILE}" > "${FILE}.sha256"
            fi
          done

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            manager/cli/${{ matrix.outfile }}
            manager/cli/${{ matrix.outfile }}.sha256
            manager/cli/${{ matrix.outfile }}.zip
            manager/cli/${{ matrix.outfile }}.zip.sha256

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: outfitting-manager-*
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
